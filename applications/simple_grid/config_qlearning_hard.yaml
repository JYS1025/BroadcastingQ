seed: 0

application:
  name: simple_grid
  entrypoint: applications.simple_grid.env:SimpleGridEnv
  visualizer: applications.simple_grid.visualize:SimpleGridVisualizer

env:
  gym_env_id: SimpleGrid-v0
  prefer_external: false
  nrow: 10
  ncol: 10
  map_name: four_rooms
  random_start: true
  goal_mode: random_corners
  goal_locations: [[0, 0], [0, 9], [9, 0], [9, 9]]
  include_goal_id: true
  action_slip_probability: 0.10
  max_steps: 150
  step_reward: -0.1
  invalid_move_reward: -1.0
  goal_reward: 10.0

agent:
  name: q_learning
  gamma: 0.99
  learning_rate: 0.1
  epsilon:
    type: linear
    start: 1.0
    end: 0.05
    decay_steps: 20000

training:
  total_steps: 80000
  eval_interval: 2000
  eval_episodes: 100
  eval_seed: 1
  eval_max_steps: 150
  log_interval: 1000
  save_interval: 50000
  progress_bar: true

visualization:
  enabled: true
  interval: 10000
  episodes: 1
  format: gif
  fps: 6
  max_steps: 150

logging:
  output_root: outputs
  run_name: simple_grid_hard_Qlearning
  save_csv: true

