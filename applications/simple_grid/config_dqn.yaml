seed: 0

application:
  name: simple_grid
  entrypoint: applications.simple_grid.env:SimpleGridEnv
  visualizer: applications.simple_grid.visualize:SimpleGridVisualizer

env:
  gym_env_id: SimpleGrid-v0
  prefer_external: true
  nrow: 4
  ncol: 5
  start_loc: [0, 0]
  goal_loc: [3, 4]
  obstacle_map: []
  max_steps: 100
  invalid_move_reward: -1.0
  step_reward: -0.1
  goal_reward: 1.0

agent:
  name: dqn
  device: auto
  gamma: 0.99
  learning_rate: 0.001
  batch_size: 64
  replay_size: 10000
  warmup_steps: 500
  target_update_interval: 500
  hidden_sizes: [64, 64]
  epsilon:
    type: linear
    start: 1.0
    end: 0.05
    decay_steps: 10000

training:
  total_steps: 50000
  eval_interval: 5000
  eval_episodes: 100
  eval_seed: 10000
  eval_max_steps: 100
  log_interval: 1000
  save_interval: 25000
  progress_bar: true

visualization:
  enabled: true
  interval: 5000
  episodes: 1
  format: gif
  fps: 6
  max_steps: 100

logging:
  output_root: outputs
  run_name: simple_grid_DQN
  save_csv: true

