seed: 0

application:
  name: minigrid_dynamic_obstacles
  entrypoint: applications.minigrid_dynamic_obstacles.env:MiniGridDynamicObstaclesEnv
  visualizer: applications.minigrid_dynamic_obstacles.visualize:MiniGridDynamicObstaclesVisualizer

env:
  minigrid_env_id: MiniGrid-Dynamic-Obstacles-Random-6x6-v0
  action_subset: [left, right, forward]
  max_obstacles: 1
  max_steps_override: null

agent:
  name: q_learning
  gamma: 0.99
  learning_rate: 0.1
  epsilon:
    type: linear
    start: 1.0
    end: 0.05
    decay_steps: 50000

training:
  total_steps: 200000
  eval_interval: 5000
  eval_episodes: 100
  eval_seed: 1
  eval_max_steps: 256
  log_interval: 1000
  save_interval: 50000
  progress_bar: true

visualization:
  enabled: true
  interval: 5000
  episodes: 1
  format: gif
  fps: 6
  max_steps: 256

logging:
  output_root: outputs
  run_name: minigrid_dynamic_obstacles_hard_Qlearning
  save_csv: true

