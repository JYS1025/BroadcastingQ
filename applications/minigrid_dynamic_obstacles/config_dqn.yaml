seed: 0

application:
  name: minigrid_dynamic_obstacles
  entrypoint: applications.minigrid_dynamic_obstacles.env:MiniGridDynamicObstaclesEnv
  visualizer: applications.minigrid_dynamic_obstacles.visualize:MiniGridDynamicObstaclesVisualizer

env:
  minigrid_env_id: MiniGrid-Dynamic-Obstacles-5x5-v0
  action_subset: [left, right, forward]
  max_obstacles: 2
  max_steps_override: null

agent:
  name: dqn
  device: auto
  gamma: 0.99
  learning_rate: 0.001
  batch_size: 64
  replay_size: 30000
  warmup_steps: 2000
  target_update_interval: 1000
  hidden_sizes: [64, 64]
  epsilon:
    type: linear
    start: 1.0
    end: 0.05
    decay_steps: 50000

training:
  total_steps: 200000
  eval_interval: 10000
  eval_episodes: 100
  eval_seed: 10000
  eval_max_steps: 100
  log_interval: 1000
  save_interval: 50000
  progress_bar: true

visualization:
  enabled: true
  interval: 10000
  episodes: 1
  format: gif
  fps: 6
  max_steps: 100

logging:
  output_root: outputs
  run_name: minigrid_dynamic_obstacles_DQN
  save_csv: true

