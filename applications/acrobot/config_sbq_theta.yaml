seed: 0

application:
  name: acrobot
  entrypoint: applications.acrobot.env:AcrobotEnv
  visualizer: applications.acrobot.visualize:AcrobotVisualizer

env:
  gym_env_id: Acrobot-v1
  book_or_nips: null

observation:
  type: theta_binned
  theta_bin_counts: [21,21,11,11]

agent:
  name: sbq
  gamma: 0.99
  learning_rate: 0.1
  epsilon:
    type: linear
    start: 1.0
    end: 0.05
    decay_steps: 100000
  beta_0: 1.0
  p: 0.5
  kernel_lambda: 1.0
  # With these bin counts, Hamming radius one produces 41 neighbors per
  # visited state; radius two is substantially more costly.
  search_radius: 1.0
  alpha_k: 0.1
  use_local_normalization: true

training:
  total_steps: 300000
  eval_interval: 5000
  eval_episodes: 20
  log_interval: 1000
  save_interval: 50000
  progress_bar: true
  eval_seed: 10000

visualization:
  enabled: true
  interval: 10000
  episodes: 1
  format: gif
  fps: 30
  max_steps: 500

logging:
  output_root: outputs
  run_name: acrobot_sbq_theta_seed0
  save_csv: true
