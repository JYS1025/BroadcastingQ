seed: 0

application:
  name: acrobot
  entrypoint: applications.acrobot.env:AcrobotEnv
  visualizer: applications.acrobot.visualize:AcrobotVisualizer

env:
  gym_env_id: Acrobot-v1
  book_or_nips: null

observation:
  type: multidiscrete_binned_continuous
  bin_counts: [8, 8, 8, 8, 10, 10]

agent:
  name: dqn
  device: auto
  gamma: 0.99
  learning_rate: 0.0005
  batch_size: 64
  replay_size: 100000
  warmup_steps: 1000
  target_update_interval: 1000
  hidden_sizes: [128, 128]
  epsilon:
    type: linear
    start: 1.0
    end: 0.05
    decay_steps: 100000

training:
  total_steps: 300000
  eval_interval: 5000
  eval_episodes: 20
  log_interval: 1000
  save_interval: 50000
  progress_bar: true

visualization:
  enabled: true
  interval: 10000
  episodes: 1
  format: gif
  fps: 30
  max_steps: 500

logging:
  output_root: outputs
  run_name: acrobot_dqn_naive_bins_seed0
  save_csv: true
