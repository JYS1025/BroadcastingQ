seed: 0

application:
  name: acrobot
  entrypoint: applications.acrobot.env:AcrobotEnv
  visualizer: applications.acrobot.visualize:AcrobotVisualizer

env:
  gym_env_id: Acrobot-v1
  book_or_nips: null

observation:
  type: theta_binned
  theta_bin_counts: [16, 16, 16, 16]

agent:
  name: acrobot_structural_sbq
  gamma: 0.99
  learning_rate: 0.1
  epsilon:
    type: linear
    start: 1.0
    end: 0.05
    decay_steps: 100000
  beta_0: 1.0
  p: 0.6
  kernel_lambda: 0.7
  search_radius: 2.0
  alpha_k: 0.1
  use_local_normalization: false

training:
  total_steps: 500000
  eval_interval: 10000
  eval_episodes: 200
  log_interval: 1000
  save_interval: 50000
  progress_bar: true
  eval_seed: 0

visualization:
  enabled: true
  interval: 10000
  episodes: 1
  format: gif
  fps: 30
  max_steps: 500

logging:
  output_root: outputs
  run_name: Acrobot_SBQ(ours)
  save_csv: true
