seed: 0

application:
  name: lunar_lander
  entrypoint: applications.lunar_lander.env:LunarLanderEnv
  visualizer: applications.lunar_lander.visualize:LunarLanderVisualizer

env:
  gym_env_id: LunarLander-v3
  continuous: false
  gravity: -10.0
  enable_wind: false
  wind_power: 15.0
  turbulence_power: 1.5

observation:
  type: multidiscrete_binned_continuous
  continuous_bin_counts: [7, 7, 7, 7, 9, 7]

agent:
  name: sbq
  gamma: 0.99
  learning_rate: 0.1
  beta_0: 1.0
  p: 0.5
  kernel_lambda: 1.0
  search_radius: 1
  alpha_k: 0.05
  use_local_normalization: true
  epsilon:
    type: linear
    start: 1.0
    end: 0.05
    decay_steps: 200000

training:
  total_steps: 500000
  eval_interval: 20000
  eval_episodes: 20
  log_interval: 2000
  save_interval: 100000
  progress_bar: true

visualization:
  enabled: true
  interval: 20000
  episodes: 1
  format: gif
  fps: 30
  max_steps: 1000

logging:
  output_root: outputs
  run_name: lunar_lander_sbq_naive_hamming_seed0
  save_csv: true
