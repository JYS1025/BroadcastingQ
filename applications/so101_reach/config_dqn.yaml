seed: 0

env:
  task: Isaac-SO-ARM101-Reach-v0
  num_envs: 1
  render_mode: null
  ee_body_name: gripper_link
  command_name: ee_pose
  command_resampling_time: episode
  success_threshold: 0.03
  terminate_on_success: true
  success_bonus: 0.0
  disable_observation_noise: true

reward:
  use_shaped_reward: true
  raw_reward_scale: 0.0
  progress_scale: 10.0
  distance_scale: 1.0
  success_bonus: 10.0
  failure_step_penalty: 0.0

action:
  joint_names: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex]
  step_size: 0.20
  include_noop: true

observation:
  position_error:
    low: -0.30
    high: 0.30
    edges: [-0.20, -0.10, -0.05, -0.025, -0.01, 0.01, 0.025, 0.05, 0.10, 0.20]
    distance_scale: [0.05, 0.05, 0.05]
  joint_position:
    bins: 5
    distance_scale: 0.50

agent:
  name: dqn
  gamma: 0.99
  learning_rate: 0.0005
  batch_size: 64
  replay_size: 50000
  warmup_steps: 1000
  target_update_interval: 1000
  hidden_sizes: [128, 128]
  grad_clip_norm: 10.0
  device: auto
  epsilon:
    type: linear
    start: 0.8
    end: 0.05
    decay_steps: 100000

training:
  total_steps: 200000
  eval_interval: 5000
  eval_episodes: 20
  eval_max_steps: 360
  log_interval: 1000
  save_interval: 25000
  progress_bar: true

logging:
  output_root: outputs
  run_name: so101_reach_dqn_seed0

