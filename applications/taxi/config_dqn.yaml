seed: 1

application:
  name: taxi
  entrypoint: applications.taxi.env:TaxiEnv
  visualizer: applications.taxi.visualize:TaxiVisualizer

env:
  gym_env_id: Taxi-v4
  render_mode: ansi
  kwargs: {}

observation:
  type: decoded_taxi

agent:
  name: dqn
  device: auto
  gamma: 0.99
  learning_rate: 0.0005
  batch_size: 64
  replay_size: 50000
  warmup_steps: 1000
  target_update_interval: 1000
  hidden_sizes: [64, 64]
  epsilon:
    type: linear
    start: 1.0
    end: 0.05
    decay_steps: 20000

training:
  total_steps: 200000
  eval_interval: 10000
  eval_episodes: 500
  eval_seed: 1
  log_interval: 1000
  save_interval: 50000
  progress_bar: true

visualization:
  enabled: true
  interval: 10000
  episodes: 1
  format: gif
  fps: 4
  max_steps: 201

logging:
  output_root: outputs
  run_name: taxi_dqn_seed0
  save_csv: true
