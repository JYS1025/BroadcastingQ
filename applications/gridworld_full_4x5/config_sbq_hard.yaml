seed: 0

application:
  name: gridworld_full_4x5
  entrypoint: applications.gridworld_full_4x5.env:GridworldFull4x5Env
  visualizer: applications.gridworld_full_4x5.visualize:GridworldFull4x5Visualizer

env:
  height: 10
  width: 10
  random_start: true
  goal_mode: random_corners
  goal_locations: [[0, 0], [0, 9], [9, 0], [9, 9]]
  include_goal_id: true
  walls: []
  max_steps: 100
  step_reward: -1.0
  invalid_move_reward: -1.0
  goal_reward: 20.0

agent:
  name: gridworld_full_4x5_sbq
  gamma: 0.99
  learning_rate: 0.1
  epsilon:
    type: linear
    start: 1.0
    end: 0.05
    decay_steps: 30000
  beta_0: 1.0
  p: 0.5
  kernel_lambda: 0.7
  search_radius: 2.0
  alpha_k: 0.1
  use_local_normalization: true

training:
  total_steps: 200000
  eval_interval: 10000
  eval_episodes: 100
  eval_seed: 1
  eval_max_steps: 100
  log_interval: 1000
  save_interval: 50000
  progress_bar: true

visualization:
  enabled: true
  interval: 10000
  episodes: 1
  format: gif
  fps: 6
  max_steps: 100

logging:
  output_root: outputs
  run_name: gridworld_full_4x5_hard_SBQ(ours)
  save_csv: true

