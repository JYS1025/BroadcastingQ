seed: 0

application:
  name: gridworld_full_4x5
  entrypoint: applications.gridworld_full_4x5.env:GridworldFull4x5Env
  visualizer: applications.gridworld_full_4x5.visualize:GridworldFull4x5Visualizer

env:
  height: 4
  width: 5
  start_pos: [3, 0]
  goal_pos: [0, 4]
  walls: []
  max_steps: 100
  step_penalty: -1.0
  goal_reward: 1.0

agent:
  name: dqn
  device: auto
  gamma: 0.99
  learning_rate: 0.001
  batch_size: 64
  replay_size: 10000
  warmup_steps: 500
  target_update_interval: 500
  hidden_sizes: [64, 64]
  epsilon:
    type: linear
    start: 1.0
    end: 0.05
    decay_steps: 10000

training:
  total_steps: 50000
  eval_interval: 5000
  eval_episodes: 100
  eval_seed: 10000
  eval_max_steps: 100
  log_interval: 1000
  save_interval: 25000
  progress_bar: true

visualization:
  enabled: true
  interval: 5000
  episodes: 1
  format: gif
  fps: 6
  max_steps: 100

logging:
  output_root: outputs
  run_name: gridworld_full_4x5_DQN
  save_csv: true

